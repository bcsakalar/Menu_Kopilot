name: menu_kopilot
description: "Menü Kopilot — şube açılış asistanı"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  dio: ^5.11.1
  flutter_secure_storage: ^11.1.1
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  path: ^1.9.1
  camera: ^0.12.1
  image_picker: ^1.2.3
  flutter_image_compress: ^2.5.1
  image_size_getter: ^2.4.1
  crypto: ^3.0.7
  wakelock_plus: ^1.8.0
  share_plus: ^13.3.0
  connectivity_plus: ^7.3.1
  workmanager: ^0.10.10
  intl: ^0.20.3
  collection: ^1.19.1
  uuid: ^4.6.0
  record: ^7.1.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1
  mocktail: ^1.0.5
  http_mock_adapter: ^0.6.1

flutter:
  uses-material-design: true
  # All UI strings live in lib/l10n/app_tr.arb (single l10n file; add app_en.arb later for English).
  generate: true
