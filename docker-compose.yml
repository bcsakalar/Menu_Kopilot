# Menü Kopilot — `docker compose up -d --build` starts api + postgres(pgvector) + redis + caddy.
# Works without a .env file (development defaults). For production copy .env.example → .env and fill it in.
# Memory limits are sized for a 1 GB droplet (add swap, see README).
name: menu-kopilot

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-menu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-menu}
      POSTGRES_DB: ${POSTGRES_DB:-menu_kopilot}
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=192MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=30
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 30
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    mem_limit: 256m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # BullMQ requires noeviction; every cache key carries a TTL instead.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '96mb', '--maxmemory-policy', 'noeviction']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 30
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    mem_limit: 128m

  api:
    build:
      context: ./backend
    image: ${API_IMAGE:-menu-kopilot-api:local}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgres://${POSTGRES_USER:-menu}:${POSTGRES_PASSWORD:-menu}@postgres:5432/${POSTGRES_DB:-menu_kopilot}
      REDIS_URL: redis://redis:6379
      SEED_ON_START: ${SEED_ON_START:-true}
      TRUST_PROXY: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    mem_limit: 384m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    mem_limit: 64m

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
