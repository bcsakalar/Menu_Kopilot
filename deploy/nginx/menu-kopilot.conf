## /etc/nginx/sites-available/menu-kopilot.conf
## Menü Kopilot — nginx reverse proxy for the site and the API (one Docker app on 127.0.0.1:3030)
##
## Domain: menu.example.com (Cloudflare proxied, SSL/TLS mode Full (Strict))
## SSL:    Cloudflare Origin Certificate for *.example.com — the same files the other subdomains use.
##
## Collisions with the other sites on this server (checked before adding):
##   - ports 3002 / 3006 / 3012 / 3013 / 3020 are taken       -> this app: 3030
##   - rate-limit zones are prefixed per site -> this app: mk_
##   - log files                                               -> mk.access.log / mk.error.log
##
## Install from the server's clone (see docs/DEPLOY_MYSERVER.md):
##   cp /opt/menu-kopilot/deploy/nginx/menu-kopilot.conf /etc/nginx/sites-available/
##   cp /opt/menu-kopilot/deploy/nginx/mk-proxy.conf     /etc/nginx/snippets/
##   ln -s /etc/nginx/sites-available/menu-kopilot.conf /etc/nginx/sites-enabled/
##   nginx -t && systemctl reload nginx
## Copied, not symlinked: a git pull must never change the live proxy without `nginx -t`.

# The admin login is the only endpoint worth guessing at; the app limits it again.
limit_req_zone $binary_remote_addr zone=mk_login:5m rate=10r/m;
# The first page load is a handful of assets; SSE streams are long-lived but single requests.
limit_req_zone $binary_remote_addr zone=mk_api:10m rate=120r/m;

# Only Cloudflare (and this machine) may reach the site, so the origin IP cannot bypass the proxy.
# $realip_remote_addr is the TCP peer, before real_ip_header rewrites $remote_addr.
geo $realip_remote_addr $mk_via_cloudflare {
    default 0;
    127.0.0.1 1;
    ::1 1;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}
limit_conn_zone $binary_remote_addr zone=mk_conn:5m;

upstream menu_kopilot_api {
    server 127.0.0.1:3030 max_fails=3 fail_timeout=15s;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name menu.example.com;
    if ($mk_via_cloudflare = 0) { return 444; }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name menu.example.com;
    if ($mk_via_cloudflare = 0) { return 444; }

    http2 on;

    # Rate limits must see the visitor, not the Cloudflare edge.
    include /etc/nginx/snippets/cloudflare-realip.conf;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    include /etc/nginx/snippets/ssl-params.conf;

    access_log /var/log/nginx/mk.access.log;
    error_log  /var/log/nginx/mk.error.log;

    server_tokens off;

    # The app sends no security headers itself. Screenshots are pasted as blob: URLs and fonts come from the bundle.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    # Up to 5 compressed photos per request (the API allows 45 MB in total and rejects more itself).
    client_max_body_size 45M;
    client_body_timeout  60s;

    limit_conn mk_conn 20;
    limit_req_status  429;
    limit_conn_status 429;

    # The OpenAPI browser is for development; the site does not need it in production.
    location ~ ^/(docs|openapi\.json) {
        return 404;
    }

    location = /api/v1/auth/login {
        limit_req zone=mk_login burst=5 nodelay;
        proxy_pass http://menu_kopilot_api;
        include /etc/nginx/snippets/mk-proxy.conf;
    }

    location / {
        limit_req zone=mk_api burst=60 nodelay;
        proxy_pass http://menu_kopilot_api;
        include /etc/nginx/snippets/mk-proxy.conf;
    }
}
