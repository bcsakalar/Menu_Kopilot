## /etc/nginx/snippets/mk-proxy.conf — proxy settings for Menü Kopilot (included by menu-kopilot.conf)

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# The real-IP module already put the visitor's address into $remote_addr. Overwrite (do not append) so a client
# cannot smuggle its own X-Forwarded-For into the API's login rate limit.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;

# Server-Sent Events: suggestion cards and the gap analysis reach the phone as they are produced.
proxy_buffering off;
proxy_cache off;
proxy_request_buffering off;
# A run can take a while with deep mode; the API sends a heartbeat every 15 s.
proxy_read_timeout 300s;
proxy_send_timeout 300s;
