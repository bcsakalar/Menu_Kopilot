# Menü Kopilot — production stack for a small droplet. Nothing is built on the server: the API image is built on the
# PC and loaded over ssh (scripts/deploy.ps1) or pulled from GHCR (.github/workflows/release.yml). Secrets live in
# /etc/menu-kopilot/env (chmod 600), outside the deploy directory, so a redeploy cannot overwrite them.
#
# Two ways to expose the API:
#   - behind the host's nginx (a server that already runs other sites, e.g. myserver): the API listens on
#     127.0.0.1:${API_PORT:-3030} only and deploy/nginx/menu-kopilot.conf proxies HTTPS to it (default);
#   - on a fresh droplet: `--profile caddy` also starts Caddy on 80/443 with automatic certificates.
#
# Usage (on the server, in /srv/menu-kopilot):
#   docker compose --env-file /etc/menu-kopilot/env -f docker-compose.prod.yml up -d
#   docker compose --env-file /etc/menu-kopilot/env -f docker-compose.prod.yml --profile caddy up -d
#
# Postgres and Redis are never published on a host port.
name: menu-kopilot

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in /etc/menu-kopilot/env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in /etc/menu-kopilot/env}
      POSTGRES_DB: ${POSTGRES_DB:-menu_kopilot}
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=192MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=30
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 30
    mem_limit: 256m
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # BullMQ requires noeviction; every cache key carries a TTL instead.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '96mb', '--maxmemory-policy', 'noeviction']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 30
    mem_limit: 128m
    logging: *logging

  api:
    image: ${API_IMAGE:-ghcr.io/bcsakalar/menu-kopilot-api}:${API_TAG:-latest}
    restart: unless-stopped
    env_file:
      - /etc/menu-kopilot/env
    environment:
      NODE_ENV: production
      # Use a URL-safe password (e.g. `openssl rand -hex 24`): it is interpolated into this URL.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-menu_kopilot}
      REDIS_URL: redis://redis:6379
      TRUST_PROXY: 'true'
      ROLE: all
    # Loopback only: the host's nginx (or Caddy below) is the public entry.
    ports:
      - '127.0.0.1:${API_PORT:-3030}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 384m
    logging: *logging

  caddy:
    image: caddy:2-alpine
    # Only on a server without its own reverse proxy: `--profile caddy`.
    profiles: ['caddy']
    restart: unless-stopped
    environment:
      # Required with this profile (compose interpolates every service, so it cannot be marked required here);
      # scripts/deploy.ps1 -WithCaddy refuses to start without it.
      SITE_ADDRESS: ${SITE_ADDRESS:-}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    mem_limit: 64m
    logging: *logging

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
